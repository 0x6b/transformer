[package]
name = "transformer"
version = "1.2.3"
edition = "2024"
description = "A CLI tool to convert from JSON|TOML|YAML to JSON|TOML|YAML|Rust serde structs."

[dependencies]
# Error handling
anyhow = "1.0"

# Command-line argument parsing
clap = { version = "4.6", features = ["derive", "wrap_help"] }
json_typegen_shared = "0.7.0"

# Ser/de
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yml = "0.0.13"
toml = "1.1"

# Optimize for size
[profile.release]
opt-level = "z"
strip = true
lto = true
codegen-units = 1
panic = "abort"
